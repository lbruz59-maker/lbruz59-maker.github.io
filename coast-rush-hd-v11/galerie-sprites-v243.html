<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sprites OutRun HD V243</title><style>body{font:16px system-ui;background:#101b2c;color:#fff;margin:0;padding:18px}h1{font-size:1.5rem}p{color:#c4d2e4}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.sprite{background:#233149;border:1px solid #4b627c;border-radius:12px;padding:12px}.sprite canvas{width:100%;height:165px;background:repeating-conic-gradient(#39465c 0 25%,#2b3850 0 50%) 0 0/20px 20px}.sprite strong{display:block;margin-top:8px}.sprite small{color:#b8c8da}a{color:#a6d5ff}</style><script src="./sprites.js?v=181"></script><h1>V243 — Sprites authentiques OutRun HD</h1><p>Découpes exactes des atlas WebP d'OutRun HD. Le sprite 66226 est utilisé pour remplacer la bannière START. Les autres sont placés sur les côtés des circuits. La galerie ne modifie pas leur taille dans le jeu.</p><p><a href="./test-hd-v243.html?v=243">Tester le jeu V243</a></p><main id="items"></main><script>const groups=[['Bannière de départ remplacée',['66226']],['Nouveaux décors V243',['64096','64106','65006','64126','64146','64156','64206','64356','64406']],['Végétation et relief V242',['64456','64706','64756','64856','64906','64256','64556','64656','64606','67216','68276','68376']]];const atlas=window.hdSprites,root=document.getElementById('items');const imgs=atlas.images.map(file=>{const im=new Image();im.src='./'+file;return im});for(const [group,keys]of groups)for(const key of keys){const f=atlas.frames[key];if(!f)continue;const card=document.createElement('div');card.className='sprite';const c=document.createElement('canvas');c.width=180;c.height=165;const title=document.createElement('strong');title.textContent=key;const sub=document.createElement('small');sub.textContent=group+' · '+f[3]+'×'+f[4];card.append(c,title,sub);root.append(card);const im=imgs[f[0]];const draw=()=>{if(!im.naturalWidth){sub.textContent='Texture manquante';return}const scale=Math.min(174/f[3],155/f[4]);const w=f[3]*scale,h=f[4]*scale;c.getContext('2d').drawImage(im,f[1],f[2],f[3],f[4],(180-w)/2,160-h,w,h)};if(im.complete)draw();else im.addEventListener('load',draw)}</script></html>

<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coast Rush HD — Audit 519 sprites V319</title><style>body{margin:0;background:#101722;color:#f2f5fa;font:14px system-ui}header{position:sticky;top:0;background:#182234;padding:12px;z-index:2;display:flex;gap:9px;flex-wrap:wrap;align-items:center}input,select{background:#263449;color:white;border:1px solid #62718b;padding:8px;border-radius:6px}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px;padding:12px}.tile{background:#202c3e;border:1px solid #42516b;border-radius:8px;padding:8px}.preview{height:128px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:repeating-conic-gradient(#354054 0 25%,#273246 0 50%) 0/20px 20px}.preview canvas{max-width:100%;max-height:124px}.id{font-weight:bold;font-size:15px;margin-top:7px}.meta{font-size:11px;color:#aab7ca}#count{font-weight:bold}</style></head><body><header><b>Audit visuel des 519 sprites OutRun HD — V319</b><input id="q" placeholder="Identifiant (ex. 64806)"><select id="cat"><option value="">Toutes catégories</option><option>scene</option><option>final</option><option>traffic</option><option>riders</option><option>ferrari</option><option>car</option></select><span id="count"></span></header><main id="grid"></main><script src="./sprites.js?v=181"></script><script>
const atlas=window.hdSprites,imgs=atlas.images.map(src=>{const i=new Image();i.src=src;return i}),entries=Object.entries(atlas.frames),grid=document.getElementById('grid');
function render(){const q=document.getElementById('q').value.trim().toLowerCase(),cat=document.getElementById('cat').value;const filtered=entries.filter(([id,f])=>(!q||id.toLowerCase().includes(q))&&(!cat||f[9]===cat));document.getElementById('count').textContent=filtered.length+' / '+entries.length;grid.replaceChildren();for(const [id,f] of filtered){const el=document.createElement('article');el.className='tile';const pre=document.createElement('div');pre.className='preview';const c=document.createElement('canvas');c.width=f[3];c.height=f[4];pre.append(c);el.append(pre);const title=document.createElement('div');title.className='id';title.textContent=id;el.append(title);const meta=document.createElement('div');meta.className='meta';meta.textContent=f[9]+' · '+f[3]+' × '+f[4]+' · '+atlas.images[f[0]];el.append(meta);grid.append(el);const im=imgs[f[0]];const draw=()=>{if(c.isConnected&&im.naturalWidth)c.getContext('2d').drawImage(im,f[1],f[2],f[3],f[4],0,0,f[3],f[4])};if(im.complete)draw();else im.addEventListener('load',draw,{once:true});}}
document.getElementById('q').addEventListener('input',render);document.getElementById('cat').addEventListener('change',render);render();
</script></body></html>

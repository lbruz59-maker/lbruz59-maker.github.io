<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coast Rush HD V242 — Vrais sprites OutRun HD</title><style>body{font:16px system-ui;background:#101b2c;color:#fff;margin:0;padding:20px}h1{font-size:1.5rem}p{color:#c4d2e4}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px}.sprite{background:#233149;border:1px solid #4b627c;border-radius:12px;padding:12px}.sprite canvas{width:100%;height:160px;object-fit:contain;background:repeating-conic-gradient(#39465c 0 25%,#2b3850 0 50%) 0 0/20px 20px}.sprite strong{display:block;margin-top:8px}.sprite small{color:#b8c8da}a{color:#a6d5ff}</style><script src="./sprites.js?v=181"></script><h1>V242 — Sprites authentiques OutRun HD</h1><p>Découpes exactes des planches HD WebP, lues depuis <code>sprites.js</code>. Aucun PNG de substitution, aucune illustration générée, aucun recadrage manuel. Les dimensions sont adaptées uniquement à la vignette de présentation, pas au moteur du jeu.</p><p><a href="./test-hd-v242.html?v=242">Tester la V242</a></p><main id="items"></main><script>
const groups=[['Palmiers / littoral',['64456','64706','64756']],['Végétation méditerranéenne',['64856','64906']],['Arbres campagne / Alpes',['64256','64556','64656','64606']],['Mobilier / décor urbain',['64136','64166','64176']],['Rochers / relief',['67216','68276','68376']]];
const root=document.getElementById('items'),atlas=window.hdSprites;
const imgs=atlas.images.map(file=>{const im=new Image();im.src='./'+file;return im});
for(const [group,keys] of groups)for(const key of keys){const frame=atlas.frames[key];if(!frame)continue;const card=document.createElement('div');card.className='sprite';const canvas=document.createElement('canvas');canvas.width=180;canvas.height=160;const title=document.createElement('strong');title.textContent='Sprite HD '+key;const sub=document.createElement('small');sub.textContent=group+' · '+frame[3]+' × '+frame[4]+' px';card.append(canvas,title,sub);root.append(card);const im=imgs[frame[0]];function paint(){if(!im.naturalWidth){sub.textContent='Texture indisponible : '+atlas.images[frame[0]];return}const scale=Math.min(170/frame[3],150/frame[4]);const w=frame[3]*scale,h=frame[4]*scale;canvas.getContext('2d').drawImage(im,frame[1],frame[2],frame[3],frame[4],(180-w)/2,155-h,w,h)}if(im.complete)paint();else{im.addEventListener('load',paint);im.addEventListener('error',()=>sub.textContent='Texture indisponible : '+atlas.images[frame[0]])}}
</script></html>

<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coast Rush HD V324 — Catégories sprites</title><script src="./sprites.js?v=181"></script><style>body{margin:0;background:#101820;color:#f4f7fa;font:15px system-ui}header{position:sticky;top:0;background:#172938;padding:12px;z-index:2}a{color:#9be3ff}button,select,input{font:inherit}button{padding:7px;border:0;border-radius:5px;background:#29769b;color:white}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;padding:12px}.card{background:#233341;border-radius:9px;padding:10px}.card canvas{display:block;margin:auto;background:#52606b;width:100%;height:130px;object-fit:contain}.opts{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:12px}.opts label{display:flex;gap:4px;align-items:center}.meta{margin:7px 0}input[type=search]{width:150px;max-width:35vw}#summary{font-size:12px;color:#b5d8e9}select{max-width:45vw}</style></head><body><header><b>Coast Rush HD — sélection des sprites V324</b> <a href="./test-hd-v324.html?v=324">Retour au jeu</a><p>Un sprite peut appartenir à plusieurs catégories. « Tous les circuits » autorise son utilisation dans tous les environnements compatibles avec son rôle.</p><div><input id="find" type="search" placeholder="Numéro du sprite"> <select id="filter"><option value="">Toutes les catégories</option></select> <button id="reset">Rétablir la présélection</button></div><div id="summary"></div></header><main id="grid"></main><script>
const BASE={"64056":"Forêt / campagne","64066":"Forêt / campagne","64076":"Forêt / campagne","64086":"Forêt / campagne","64096":"Forêt / campagne","64106":"Forêt / campagne","64116":"Désert","64126":"Forêt / campagne","64136":"Plage / mer","64146":"Plage / mer","64156":"Désert","64166":"Forêt / campagne","64176":"Tropical","64186":"Plage / mer","64206":"Tropical","64256":"Forêt / campagne","64306":"Forêt / campagne","64456":"Plage / mer","64506":"Forêt / campagne","64556":"Forêt / campagne","64606":"Désert","64656":"Tropical","64706":"Tropical","64756":"Tropical","64806":"Désert","64856":"Désert","64906":"Désert","64956":"Désert","65006":"Désert","65056":"Désert","65066":"Désert","65106":"Plage / mer","65156":"Plage / mer","65206":"Plage / mer","65216":"Plage / mer","65676":"Plage / mer","66016":"Plage / mer","66026":"Plage / mer","66176":"Tunnel / pont","66276":"Forêt / campagne","66286":"Plage / mer","66576":"Désert","66666":"Plage / mer","66766":"Plage / mer","66866":"Plage / mer","66966":"Plage / mer","67016":"Plage / mer","67116":"Plage / mer","67136":"Plage / mer","67166":"Désert","67216":"Désert","67266":"Désert","67496":"Plage / mer","67616":"Cinématique fin","67626":"Forêt / campagne","67776":"Plage / mer","67826":"Forêt / campagne","67926":"Départ / foule","67976":"Plage / mer","68076":"Forêt / campagne","68126":"Forêt / campagne","68226":"Désert","68276":"Désert","68376":"Désert","68426":"Tropical","68696":"Forêt / campagne","68776":"Désert","68826":"Désert","68926":"Désert","68986":"Tropical","69006":"Tropical","69016":"Forêt / campagne","69086":"Cinématique fin","69096":"Cinématique fin","69346":"Désert","70446":"Animation véhicule","70456":"Animation véhicule","70476":"Animation véhicule","70486":"Animation véhicule","70616":"Cinématique fin","70626":"Cinématique fin","70646":"Cinématique fin","70656":"Cinématique fin","70676":"Cinématique fin","70686":"Cinématique fin","70706":"Cinématique fin","70716":"Cinématique fin","70736":"Cinématique fin","70746":"Cinématique fin","70766":"Cinématique fin","70776":"Cinématique fin","70796":"Cinématique fin","70806":"Cinématique fin","70826":"Cinématique fin","71166":"Cinématique fin","71186":"Cinématique fin","71196":"Cinématique fin","71226":"Cinématique fin","71246":"Cinématique fin","71256":"Cinématique fin","71276":"Cinématique fin","71286":"Cinématique fin","71306":"Cinématique fin","71316":"Cinématique fin","71336":"Cinématique fin","71346":"Cinématique fin","71366":"Cinématique fin","71376":"Cinématique fin","71396":"Cinématique fin","71406":"Cinématique fin","71426":"Cinématique fin","71436":"Cinématique fin","71466":"Cinématique fin","71476":"Cinématique fin","71516":"Cinématique fin","71526":"Cinématique fin","71546":"Cinématique fin","71556":"Cinématique fin","71576":"Cinématique fin","71586":"Cinématique fin","71606":"Cinématique fin","71616":"Cinématique fin","71636":"Cinématique fin","71646":"Cinématique fin","72596":"Départ / foule","72606":"Départ / foule","72626":"Départ / foule","72636":"Départ / foule","72746":"Départ / foule","72796":"Désert","72806":"Forêt / campagne","72816":"Forêt / campagne","72826":"Montagne / neige","72836":"Tropical"};
const CATS=["Tous les circuits","Forêt / campagne","Désert","Plage / mer","Tropical","Montagne / neige","Ville","Méditerranée","Tunnel / pont","Départ / foule","Cinématique fin","Animation véhicule"];
const FRAMES=window.hdSprites?.frames||{},FILES=window.hdSprites?.images||[];
const images=FILES.map(src=>{const im=new Image();im.src='./'+src;return im});
let saved={};try{saved=JSON.parse(localStorage.getItem('crhd_sprite_categories_v324')||'{}')||{}}catch(e){}
function categories(id,frame){if(saved[id])return saved[id];if(BASE[id])return [BASE[id]];const role=frame[9];return role==='final'?['Cinématique fin']:role==='scene'?['Forêt / campagne']:role==='traffic'||role==='riders'||role==='ferrari'||role==='car'?['Animation véhicule']:[];}
function save(id,vals){saved[id]=vals;try{localStorage.setItem('crhd_sprite_categories_v324',JSON.stringify(saved))}catch(e){alert('Stockage local saturé')}}
const grid=document.getElementById('grid'),filter=document.getElementById('filter'),find=document.getElementById('find'),summary=document.getElementById('summary');
CATS.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;filter.appendChild(o)});
function draw(canvas,frame){const im=images[frame[0]];if(!im)return;const paint=()=>{const ctx=canvas.getContext('2d'),w=frame[3],h=frame[4],k=Math.min(228/w,124/h);ctx.clearRect(0,0,240,130);ctx.drawImage(im,frame[1],frame[2],w,h,(240-w*k)/2,(130-h*k)/2,w*k,h*k)};if(im.complete&&im.naturalWidth)paint();else im.addEventListener('load',paint,{once:true})}
function render(){grid.replaceChildren();const q=find.value.trim().toLowerCase(),f=filter.value;let count=0;const frag=document.createDocumentFragment();for(const [id,frame] of Object.entries(FRAMES)){const vals=categories(id,frame);if(q&&!id.toLowerCase().includes(q))continue;if(f&&!vals.includes(f))continue;count++;const card=document.createElement('div');card.className='card';const title=document.createElement('div');title.className='meta';title.textContent=id+' — '+frame[9];card.appendChild(title);const canvas=document.createElement('canvas');canvas.width=240;canvas.height=130;card.appendChild(canvas);draw(canvas,frame);const opts=document.createElement('div');opts.className='opts';for(const cat of CATS){const label=document.createElement('label'),cb=document.createElement('input');cb.type='checkbox';cb.checked=vals.includes(cat);cb.addEventListener('change',()=>{let next=categories(id,frame).slice();if(cb.checked&&!next.includes(cat))next.push(cat);if(!cb.checked)next=next.filter(v=>v!==cat);save(id,next);if(filter.value)render();else summary.textContent=count+' sprites affichés · choix enregistrés sur cet appareil';});label.append(cb,document.createTextNode(cat));opts.appendChild(label)}card.appendChild(opts);frag.appendChild(card)}grid.appendChild(frag);summary.textContent=count+' sprites affichés sur '+Object.keys(FRAMES).length+' · choix enregistrés sur cet appareil'}
find.addEventListener('input',render);filter.addEventListener('change',render);document.getElementById('reset').onclick=()=>{if(confirm('Rétablir les catégories automatiques ?')){saved={};localStorage.removeItem('crhd_sprite_categories_v324');render()}};render();
</script></body></html>

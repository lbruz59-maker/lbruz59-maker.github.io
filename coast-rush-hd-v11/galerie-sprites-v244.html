<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coast Rush HD V244 — vrais sprites OutRun HD</title><style>body{font:16px system-ui;background:#101b2c;color:#fff;margin:0;padding:18px}h1{font-size:1.5rem}p{color:#c4d2e4}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px}.sprite{background:#233149;border:1px solid #4b627c;border-radius:12px;padding:12px}.sprite canvas{width:100%;height:170px;background:repeating-conic-gradient(#39465c 0 25%,#2b3850 0 50%) 0 0/20px 20px}.sprite strong{display:block;margin-top:8px}.sprite small{color:#b8c8da}a{color:#a6d5ff}</style><script src="./sprites.js?v=181"></script><h1>V244 — Vrais sprites HD d’OutRun HD</h1><p>Découpes directes depuis les planches originales WebP, selon les coordonnées de sprites.js. La bannière START utilise le sprite 66226. Aucun sprite n'est dessiné ou inventé pour cette galerie.</p><p><a href="./test-hd-v244.html?v=244">Ouvrir Coast Rush HD V244</a></p><main id="items"></main><script>const groups=[["Bannière START — remplacée",["66226"]],["V244 — végétation côtière",["63456","63506","63556"]],["V244 — décor urbain",["64056","64066","64076","64086"]],["V244 — nature et campagne",["64456","64506","64806","64956","65056","65106","65156","64116"]],["V244 — hiver",["64256","64606"]]];const atlas=window.hdSprites,root=document.getElementById('items');const imgs=atlas.images.map(file=>{const im=new Image();im.src='./'+file;return im});for(const [group,keys]of groups)for(const key of keys){const f=atlas.frames[key];if(!f)continue;const card=document.createElement('div');card.className='sprite';const c=document.createElement('canvas');c.width=180;c.height=170;const title=document.createElement('strong');title.textContent='Sprite '+key;const sub=document.createElement('small');sub.textContent=group+' · '+f[3]+'×'+f[4];card.append(c,title,sub);root.append(card);const im=imgs[f[0]];const draw=()=>{if(!im.naturalWidth){sub.textContent='Texture indisponible';return}const scale=Math.min(174/f[3],158/f[4]);const w=f[3]*scale,h=f[4]*scale;c.getContext('2d').drawImage(im,f[1],f[2],f[3],f[4],(180-w)/2,165-h,w,h)};if(im.complete)draw();else im.addEventListener('load',draw)}</script></html>

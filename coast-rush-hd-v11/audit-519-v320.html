<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coast Rush HD — Audit 519 sprites V320</title><style>body{margin:0;background:#101722;color:#f2f5fa;font:14px system-ui}button{background:#3876b8;color:white;border:0;padding:9px;border-radius:6px;cursor:pointer}.tile select{width:100%;margin-top:7px}.edited{border-color:#64d4a2!important}header{position:sticky;top:0;background:#182234;padding:12px;z-index:2;display:flex;gap:9px;flex-wrap:wrap;align-items:center}input,select{background:#263449;color:white;border:1px solid #62718b;padding:8px;border-radius:6px}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px;padding:12px}.tile{background:#202c3e;border:1px solid #42516b;border-radius:8px;padding:8px}.preview{height:128px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:repeating-conic-gradient(#354054 0 25%,#273246 0 50%) 0/20px 20px}.preview canvas{max-width:100%;max-height:124px}.id{font-weight:bold;font-size:15px;margin-top:7px}.meta{font-size:11px;color:#aab7ca}#count{font-weight:bold}</style></head><body><header><b>Audit visuel des 519 sprites OutRun HD — V320</b><input id="q" placeholder="Identifiant (ex. 64806)"><select id="cat"><option value="">Toutes catégories</option><option>scene</option><option>final</option><option>traffic</option><option>riders</option><option>ferrari</option><option>car</option></select><span id="count"></span><span id="edited"></span><button id="export">Exporter mes catégories</button><button id="import">Importer</button><input id="file" type="file" accept=".json,application/json" hidden><button id="reset">Réinitialiser</button></header><main id="grid"></main><script src="./sprites.js?v=181"></script><script>
const STORAGE='coastrush-hd-519-categories-v320';let changes={};try{changes=JSON.parse(localStorage.getItem(STORAGE)||'{}')}catch(e){}const options=['Non classé','Désert','Plage / mer','Forêt / campagne','Montagne / neige','Ville / monuments','Tropical','Départ / foule','Tunnel / pont','Véhicule','Personnage','Animation véhicule','Cinématique fin','Interface / effet','Autre / à vérifier'];function save(){try{localStorage.setItem(STORAGE,JSON.stringify(changes))}catch(e){}document.getElementById('edited').textContent=Object.keys(changes).length+' modifiés'}const atlas=window.hdSprites,imgs=atlas.images.map(src=>{const i=new Image();i.src=src;return i}),entries=Object.entries(atlas.frames),grid=document.getElementById('grid');
function render(){const q=document.getElementById('q').value.trim().toLowerCase(),cat=document.getElementById('cat').value;const filtered=entries.filter(([id,f])=>(!q||id.toLowerCase().includes(q))&&(!cat||f[9]===cat));document.getElementById('count').textContent=filtered.length+' / '+entries.length;grid.replaceChildren();for(const [id,f] of filtered){const el=document.createElement('article');el.className='tile';const pre=document.createElement('div');pre.className='preview';const c=document.createElement('canvas');c.width=f[3];c.height=f[4];pre.append(c);el.append(pre);const title=document.createElement('div');title.className='id';title.textContent=id;el.append(title);const meta=document.createElement('div');meta.className='meta';meta.textContent=f[9]+' · '+f[3]+' × '+f[4]+' · '+atlas.images[f[0]];el.append(meta);const sel=document.createElement('select');sel.setAttribute('aria-label','Catégorie du sprite '+id);for(const label of options){const opt=document.createElement('option');opt.value=label;opt.textContent=label;sel.append(opt)}sel.value=changes[id]||'Non classé';if(changes[id])el.classList.add('edited');sel.addEventListener('change',()=>{if(sel.value==='Non classé')delete changes[id];else changes[id]=sel.value;el.classList.toggle('edited',!!changes[id]);save()});el.append(sel);grid.append(el);const im=imgs[f[0]];const draw=()=>{if(c.isConnected&&im.naturalWidth)c.getContext('2d').drawImage(im,f[1],f[2],f[3],f[4],0,0,f[3],f[4])};if(im.complete)draw();else im.addEventListener('load',draw,{once:true});}}
document.getElementById('export').addEventListener('click',()=>{const payload={version:320,source:'OutRun HD 519',categories:changes};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='coast-rush-hd-categories-v320.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});document.getElementById('import').addEventListener('click',()=>document.getElementById('file').click());document.getElementById('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());const incoming=data.categories||data;if(!incoming||typeof incoming!=='object'||Array.isArray(incoming))throw Error('Format incorrect');for(const [id,category] of Object.entries(incoming)){if(atlas.frames[id]&&options.includes(category)&&category!=='Non classé')changes[id]=category}save();render()}catch(err){alert('Import impossible : '+err.message)}e.target.value=''});document.getElementById('reset').addEventListener('click',()=>{if(confirm('Effacer toutes les catégories personnalisées ?')){changes={};save();render()}});document.getElementById('q').addEventListener('input',render);document.getElementById('cat').addEventListener('change',render);save();render();
</script></body></html>
